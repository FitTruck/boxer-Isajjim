name: Build AI Docker Image

on:
  push:
    branches:
      - infra-dev
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: knu-2026-agion427
  REGION: asia-northeast3
  ZONE: asia-northeast3-a
  INSTANCE_NAME: isajjim-ai
  REPOSITORY: isajjim-ai
  IMAGE_NAME: boxer-isajjim
  CONTAINER_NAME: boxer-isajjim
  ARTIFACT_REGISTRY: asia-northeast3-docker.pkg.dev
  WORKLOAD_IDENTITY_PROVIDER: projects/675009148577/locations/global/workloadIdentityPools/isajjim-github-pool/providers/isajjim-github-provider
  SERVICE_ACCOUNT: isajjim-github-actions-sa@knu-2026-agion427.iam.gserviceaccount.com

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image references
        run: |
          echo "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest"

  deploy:
    name: Deploy to AI VM
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy image on VM
        run: |
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          gcloud compute ssh "${{ env.INSTANCE_NAME }}" \
            --zone="${{ env.ZONE }}" \
            --tunnel-through-iap \
            --quiet \
            --command="sudo bash -s" <<EOF
          set -euo pipefail

          IMAGE="$IMAGE"
          CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
          BOXER_DIR="/opt/boxer"
          AUTH_SECRET="isajjim-ai-auth-token"
          HF_SECRET="isajjim-ai-hf-token"

          if [ ! -d "\$BOXER_DIR/.git" ]; then
            sudo rm -rf "\$BOXER_DIR"
            sudo git clone https://github.com/facebookresearch/boxer.git "\$BOXER_DIR"
            sudo bash -c "cd '\$BOXER_DIR' && bash scripts/download_ckpts.sh"
          elif ! ls "\$BOXER_DIR"/ckpts/*.ckpt >/dev/null 2>&1; then
            sudo bash -c "cd '\$BOXER_DIR' && bash scripts/download_ckpts.sh"
          fi

          AUTH_TOKEN="\$(gcloud secrets versions access latest --secret="\$AUTH_SECRET")"
          HF_TOKEN="\$(gcloud secrets versions access latest --secret="\$HF_SECRET")"

          gcloud auth configure-docker "${{ env.ARTIFACT_REGISTRY }}" --quiet
          sudo docker pull "\$IMAGE"
          sudo docker rm -f "\$CONTAINER_NAME" 2>/dev/null || true

          PORT_8000_CONTAINERS="\$(sudo docker ps --filter "publish=8000" --format '{{.ID}} {{.Names}} {{.Ports}}' || true)"
          if [ -n "\$PORT_8000_CONTAINERS" ]; then
            echo "::error::Port 8000 is already published by another Docker container on the VM."
            echo "\$PORT_8000_CONTAINERS"
            exit 1
          fi

          sudo docker run -d \
            --name "\$CONTAINER_NAME" \
            --gpus all \
            --restart unless-stopped \
            -p 8000:8000 \
            -v "\$BOXER_DIR:/app/boxer:ro" \
            -e AUTH_TOKEN="\$AUTH_TOKEN" \
            -e HF_TOKEN="\$HF_TOKEN" \
            "\$IMAGE"

          sudo docker image prune -f
          sudo docker ps --filter "name=\$CONTAINER_NAME"
          EOF
